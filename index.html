<!doctype html><html lang="pt"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TakeOFF"><meta name="theme-color" content="#0f2a6b"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>TakeOFF</title>
<style>
:root{--b:#1f6feb;--r:#c62828;--g:#1a7f37;--bg:#f1f4fb;--c:#fff;--t:#14213d;--m:#6c7a93;--l:#e3e8f2;--sh:0 2px 10px rgba(20,33,61,.08)}
@media(prefers-color-scheme:dark){:root{--bg:#0b1020;--c:#151c33;--t:#eef2ff;--m:#97a3c0;--l:#26304d;--r:#ff6b6b;--g:#3ddc84;--sh:0 2px 10px rgba(0,0,0,.4)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:16px/1.4 -apple-system,system-ui,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--t);padding:0 0 calc(80px + env(safe-area-inset-bottom))}
.bar,.hero{background:linear-gradient(135deg,#0f2a6b,#1f6feb 70%,#4facfe);color:#fff}
.bar{display:flex;align-items:center;gap:6px;padding:calc(10px + env(safe-area-inset-top)) 12px 12px;position:sticky;top:0;z-index:5;box-shadow:0 2px 12px rgba(15,42,107,.35)}
.bar b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:18px}
.bar .ic{color:#fff}
.hero{padding:calc(24px + env(safe-area-inset-top)) 18px 28px;border-radius:0 0 28px 28px;box-shadow:0 6px 20px rgba(15,42,107,.3)}
.hero small{opacity:.85;letter-spacing:.14em;font-weight:700;text-transform:uppercase}
.hero h1{margin:6px 0 0;font-size:30px}
.pad{padding:12px 14px}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--c);border-top:1px solid var(--l);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:6;box-shadow:0 -4px 16px rgba(20,33,61,.08)}
.ni{flex:1;border:0;background:none;color:var(--m);font-size:11px;font-weight:600;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px}
.ni span{font-size:22px;filter:grayscale(1);opacity:.65;transition:.2s}
.ni.on{color:var(--b)}.ni.on span{filter:none;opacity:1;transform:translateY(-2px) scale(1.12)}
.tabs{display:flex;overflow-x:auto;gap:8px;padding:2px 14px 10px;scrollbar-width:none}
.tab{flex:none;border:0;border-radius:20px;padding:8px 15px;background:var(--c);color:var(--t);font-size:15px;box-shadow:var(--sh)}
.tab.on{background:linear-gradient(135deg,#1f6feb,#4facfe);color:#fff;font-weight:600}
.card{position:relative;background:var(--c);border-radius:16px;padding:13px 14px;margin:10px 0;box-shadow:var(--sh);transition:transform .1s}
.card:active{transform:scale(.99)}
.card[data-a=open]{padding-right:32px}
.card[data-a=open]::after{content:'›';position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:26px;color:var(--m)}
.btn{border:0;border-radius:12px;padding:11px 16px;background:var(--bg);color:var(--b);font-size:16px;font-weight:600;text-decoration:none;display:inline-block;margin:4px 0}
.btn.p{background:linear-gradient(135deg,#1f6feb,#4facfe);color:#fff;box-shadow:0 4px 12px rgba(31,111,235,.35)}
#body>.btn.p,.pad>.btn.p{display:block;width:100%;text-align:center;margin-top:14px}
.ic,.lk{border:0;background:none;color:var(--b);font-size:18px;padding:6px 9px}.lk{font-size:15px;font-weight:600}
.red{color:var(--r)}.grn{color:var(--g)}.mut{color:var(--m);font-size:14px}
label{display:block;margin:11px 0 4px;font-size:13px;font-weight:600;color:var(--m)}
.ck{display:flex;gap:10px;align-items:center;color:var(--t);font-size:16px;font-weight:400;margin:6px 0}
input,select,textarea{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--l);border-radius:12px;background:var(--bg);color:var(--t)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--b);border-color:transparent}
.ck input{width:auto}
dialog{width:100%;max-width:560px;max-height:92vh;overflow:auto;border:0;border-radius:22px 22px 0 0;margin:auto auto 0;background:var(--c);color:var(--t);padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
dialog[open]{animation:up .28s ease}
dialog::backdrop{background:#0a122a99;backdrop-filter:blur(2px)}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.pv{max-width:100%;border-radius:12px;margin:8px 0}
.tw{overflow-x:auto;background:var(--c);border-radius:16px;margin:10px 0;box-shadow:var(--sh)}
.tl{position:relative}
.tl i{position:absolute;top:20px;bottom:0;border-left:1px solid var(--l)}
.tl s{position:absolute;top:3px;font-size:10px;text-decoration:none;transform:translateX(-50%);color:var(--m)}
.tl u{position:absolute;height:26px;line-height:26px;padding:0 6px;border-radius:7px;color:#fff;font-size:12px;overflow:hidden;white-space:nowrap;text-decoration:none}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:5px 4px;text-align:right}td:first-child,th:first-child{text-align:left}
#sp{position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:linear-gradient(160deg,#0a1a45,#1f6feb 65%,#4facfe);color:#fff;transition:opacity .6s}
#sp.h{opacity:0;pointer-events:none}
#sp svg{animation:fly 1.2s cubic-bezier(.2,.8,.2,1) both;filter:drop-shadow(0 8px 16px rgba(0,0,0,.3))}
#sp h1{margin:0;font-size:44px;letter-spacing:.04em;animation:fi .9s .3s both}
#sp small{position:absolute;bottom:calc(28px + env(safe-area-inset-bottom));opacity:.85;letter-spacing:.08em;font-size:13px;animation:fi .9s .7s both}
@keyframes fly{from{transform:translate(-90px,90px) rotate(-12deg) scale(.6);opacity:0}}
@keyframes fi{from{opacity:0;transform:translateY(10px)}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
</style></head><body><div id=app></div><dialog id=d></dialog><div id=sp><svg viewBox="0 0 100 100" width=120 height=120><path d="M80 22 20 48l25 9z" fill="#fff"/><path d="M80 22 45 57l2 23z" fill="#d6e8ff"/></svg><h1>TakeOFF</h1><small>Powered by Vieira Lopes</small></div>
<script>
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,10),
esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),
fd=d=>d.split('-').reverse().join('/'),
money=(c,u)=>(c/100).toFixed(2).replace('.',',')+(u?' '+u:''),
tm=s=>+s.slice(0,2)*60+ +s.slice(3),
WD=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'],
PAL=['#1f77b4','#e8710a','#2e9e44','#8e44ad','#0e9aa7','#c2185b','#8d6e63','#3f51b5','#558b2f','#607d8b'],
rng=t=>fd(t.start)+(t.end&&t.end!=t.start?' → '+fd(t.end):''),
dl=s=>WD[new Date(s+'T12:00').getDay()]+' '+s.slice(8)+'/'+s.slice(5,7),
days=t=>{const o=[];if(!t.start)return o;let d=new Date(t.start+'T12:00');const e=new Date((t.end||t.start)+'T12:00');while(d<=e&&o.length<366){o.push(d.toLocaleDateString('sv-SE'));d=new Date(d.getTime()+864e5)}return o},
uniq=a=>[...new Map(a.filter(Boolean).map(x=>[x.toLowerCase(),x])).values()],
DB=new Promise((ok,ko)=>{const q=indexedDB.open('viagens',1);q.onupgradeneeded=()=>{q.result.createObjectStore('t',{keyPath:'id'});q.result.createObjectStore('f')};q.onsuccess=()=>ok(q.result);q.onerror=ko}),
io=async(s,m,f)=>{const d=await DB;return new Promise((ok,ko)=>{const r=f(d.transaction(s,m).objectStore(s));r.onsuccess=()=>ok(r.result);r.onerror=ko})},
save=t=>(t.updated=new Date().toISOString(),io('t','readwrite',s=>s.put(t))),fput=(i,b)=>io('f','readwrite',s=>s.put(b,i)),fget=i=>io('f','readonly',s=>s.get(i)),fdel=i=>io('f','readwrite',s=>s.delete(i));
let T=[],S={tab:'d',sub:'geral',cs:'f'};
const go=()=>S.trip?tripV():homeV();
function dlg(h,ok,extra=''){const d=$('#d');d.innerHTML=`<form>${h}<div class=row>${extra}<button type=button class=btn id=x>Cancelar</button><button class="btn p">Guardar</button></div></form>`;
$('#x').onclick=()=>d.close();d.querySelector('form').onsubmit=async e=>{e.preventDefault();if(await ok(new FormData(e.target))!==false)d.close()};if(!d.open)d.showModal()}
const own=(t,o)=>o=='geral'?'Geral':t.people.find(p=>p.id==o)?.name||'';
const fl=d=>`<div class="${d.files.length?'grn':'red'}">${d.files.length?'✔ '+d.files.length+' ficheiro(s)':'⚠ Sem ficheiros'}</div>`;
function lay(acts){const tt=acts.filter(a=>a.start&&a.end&&tm(a.end)>tm(a.start)).sort((a,b)=>tm(a.start)-tm(b.start)||tm(a.end)-tm(b.end)),ends=[],lane=new Map(),pairs=[];
tt.forEach((a,i)=>{for(const b of tt.slice(0,i))if(tm(a.start)<tm(b.end)&&tm(b.start)<tm(a.end))pairs.push([b,a]);let l=ends.findIndex(e=>e<=tm(a.start));if(l<0)l=ends.push(0)-1;ends[l]=tm(a.end);lane.set(a,l)});return{tt,lane,pairs,n:ends.length}}

function homeV(){$('#app').innerHTML=`<div class=hero><small>✈ TakeOFF</small><h1>As minhas viagens</h1></div><div class=pad>${T.map(t=>`<div class=card data-a=open data-id=${t.id}><b>${esc(t.name)}</b> <span class=mut>${esc(t.destination)}</span><div class="${t.start?'mut':'red'}">${t.start?'📅 '+rng(t):'⚠ sem datas'}</div></div>`).join('')||'<p class=mut>Ainda não tens viagens.</p>'}<button class="btn p" data-a=newtrip>➕ Nova viagem</button> <button class=btn data-a=imp>📥 Importar viagem</button><input type=file id=imp hidden> <button class=btn data-a=acc>☁ ${U?esc(U.user.email):'Entrar'}</button> <button class=btn data-a=joinv>🔗 Convite</button></div>`}

function tripV(){const t=S.trip,tb=[['d','📄','Documentos'],['r','🗺','Roteiro'],['c','💰','Contas']];
$('#app').innerHTML=`<div class=bar><button class=ic data-a=home>←</button><b>${esc(t.name)}${t.destination?' — '+esc(t.destination):''}</b><button class=ic data-a=exp>📤</button><button class=ic data-a=edtrip>✏</button></div><div class=pad><span class="${t.start?'grn':'red'}">${t.start?'📅 '+rng(t)+' ('+days(t).length+' dias)':'⚠ Datas da viagem não definidas'}</span> <button class=lk data-a=dates>${t.start?'Editar':'Definir datas'}</button><div>${t.cloud?`☁ <b>Convite: ${t.cloud.code}</b> <button class=lk data-a=cp>Copiar</button>`:'<button class=lk data-a=up>☁ Enviar para a nuvem</button>'}</div></div><div class=pad id=body></div><div class=nav>${tb.map(([k,i,n])=>`<button class="ni${S.tab==k?' on':''}" data-a=tab data-k=${k}><span>${i}</span>${n}</button>`).join('')}</div>`;
({d:docsV,r:rotV,c:contasV})[S.tab]()}

const chips=(l,cur,a)=>`<div class=tabs style="padding:0 0 8px">${l.map(([k,n])=>`<button class="tab${cur==k?' on':''}" data-a=${a} data-k=${k}>${esc(n)}</button>`).join('')}</div>`;

function docsV(){const t=S.trip;if(S.sub!='geral'&&!t.people.some(p=>p.id==S.sub))S.sub='geral';
$('#body').innerHTML=chips([['geral','📁 Geral'],...t.people.map(p=>[p.id,'👤 '+p.name]),['+','＋']],S.sub,'sub')+t.docs.filter(d=>d.owner==S.sub).map(d=>`<div class=card data-a=view data-id=${d.id}><b>${esc(d.title)}</b> <span class=mut>${esc(d.category)}</span>${fl(d)}</div>`).join('')+`<button class="btn p" data-a=new>➕ Novo item</button>`}

function contasV(){const t=S.trip;$('#body').innerHTML=chips([['f','🧾 Faturas'],['a','📊 Acertos']],S.cs,'cs')+(S.cs=='f'?fat(t):ace(t))}
const bad=d=>!d.amount||!d.cur||!d.paid||!d.split.length;
const fat=t=>t.docs.filter(d=>d.owner=='contas').reverse().map(d=>`<div class=card data-a=view data-id=${d.id}><b>${esc(d.title)}</b> <span class=mut>${esc(d.category)}</span><div>${d.amount?money(d.amount,d.cur):'—'} <span class=mut>· pago por ${esc(own(t,d.paid)||'?')}</span></div>${bad(d)?'<div class=red>⚠ Fatura incompleta</div>':''}${fl(d)}</div>`).join('')+'<button class="btn p" data-a=newc>➕ Nova fatura</button>';

function ace(t){const P=t.people,G={},sel=S.fsel||new Set(P.map(p=>p.id));let inc=0;
t.docs.filter(d=>d.owner=='contas').forEach(d=>{const sp=d.split.filter(i=>P.some(p=>p.id==i));if(bad(d)||!P.some(p=>p.id==d.paid)||!sp.length){inc++;return}
const g=G[d.cur.toLowerCase()]??={cur:d.cur,tot:0,pd:{},sh:{},ow:{}};g.tot+=d.amount;g.pd[d.paid]=(g.pd[d.paid]||0)+d.amount;
const q=Math.floor(d.amount/sp.length),r=d.amount%sp.length;
sp.forEach((p,i)=>{const s=q+(i<r?1:0);g.sh[p]=(g.sh[p]||0)+s;if(p!=d.paid){const k=p+'>'+d.paid;g.ow[k]=(g.ow[k]||0)+s}})});
return `<div class=card><b>Ver as contas de:</b>${P.map(p=>`<label class=ck><input type=checkbox data-a=fil data-id=${p.id}${sel.has(p.id)?' checked':''}>${esc(p.name)}</label>`).join('')}</div>`
+(inc?`<div class=red>⚠ ${inc} fatura(s) incompleta(s) fora do cálculo (falta valor, moeda, quem pagou ou divisão).</div>`:'')
+(Object.values(G).map(g=>{const db=[];P.forEach((a,i)=>P.slice(i+1).forEach(b=>{const n=(g.ow[a.id+'>'+b.id]||0)-(g.ow[b.id+'>'+a.id]||0);if(n)db.push(n>0?[a,b,n]:[b,a,-n])}));
const sd=db.filter(([x,y])=>sel.has(x.id)||sel.has(y.id));
return `<div class=card><b>💱 ${esc(g.cur)} — total ${money(g.tot,g.cur)}</b><table><tr><th><th>Pagou<th>Parte<th>Saldo</tr>${P.filter(p=>sel.has(p.id)).map(p=>{const s=(g.pd[p.id]||0)-(g.sh[p.id]||0);return `<tr><td>${esc(p.name)}<td>${money(g.pd[p.id]||0)}<td>${money(g.sh[p.id]||0)}<td class="${s>0?'grn':s<0?'red':''}">${(s>0?'+':'')+money(s)}</tr>`}).join('')}</table>${sd.map(([x,y,n])=>`<div class=red>${esc(x.name)} deve ${money(n,g.cur)} a ${esc(y.name)}</div>`).join('')||'<div class=grn>✔ Sem dívidas</div>'}</div>`}).join('')||'<p class=mut>Ainda não há faturas completas.</p>')}

function rotV(){const t=S.trip,b=$('#body'),ds=days(t),orph=t.rot.filter(a=>!ds.includes(a.day));
if(!ds.length&&!orph.length){b.innerHTML='<div class=red>⚠ Define as datas da viagem para criar os dias do roteiro.</div>';return}
if(S.day!='x'&&!ds.includes(S.day))S.day=ds[0]||'x';
const acts=S.day=='x'?orph:t.rot.filter(a=>a.day==S.day),L=lay(acts),W=Math.max(760,0);
const cl=[...ds.map(d=>[d,(lay(t.rot.filter(a=>a.day==d)).pairs.length?'⚠ ':'')+dl(d)]),...(orph.length?[['x','⚠ Fora das datas']]:[])];
b.innerHTML=chips(cl,S.day,'day')+(S.day=='x'?'<div class=red>Atividades fora das datas atuais — edita-as para as mudares de dia.</div>':`<b>Dia ${ds.indexOf(S.day)+1} — ${fd(S.day)}</b><div class=tw><div class=tl style="width:${W}px;height:${30+L.n*30}px">${[...Array(25).keys()].map(h=>`<i style="left:${h/24*100}%"></i><s style="left:${h/24*100}%">${h%2?'':String(h).padStart(2,'0')}</s>`).join('')}${L.tt.map(a=>`<u data-a=vact data-id=${a.id} style="left:${tm(a.start)/14.4}%;width:${(tm(a.end)-tm(a.start))/14.4}%;top:${24+L.lane.get(a)*30}px;background:${a.color};${L.pairs.some(p=>p.includes(a))?'outline:3px solid var(--r)':''}">${esc(a.title)}</u>`).join('')}</div></div>`)
+(L.pairs.length?`<div class=red><b>⚠ Horas coincidentes:</b><br>${L.pairs.map(([x,y])=>`${esc(x.title)} (${x.start}–${x.end}) × ${esc(y.title)} (${y.start}–${y.end})`).join('<br>')}</div>`:'')
+[...acts].sort((a,b)=>(a.start||'99').localeCompare(b.start||'99')).map(a=>`<div class=card data-a=vact data-id=${a.id} style="border-left:5px solid ${a.color}"><b>${a.start&&a.end?a.start+'–'+a.end+' ':''}${esc(a.title)}</b>${a.docs.length?`<div class=mut>📎 ${a.docs.map(i=>esc(t.docs.find(d=>d.id==i)?.title||'')).join(', ')}</div>`:''}${a.notes?`<div class=mut>${esc(a.notes)}</div>`:''}${a.start&&a.end?'':'<div class=mut>Sem horário completo — não aparece na linha do tempo</div>'}</div>`).join('')
+(S.day=='x'?'':'<button class="btn p" data-a=nact>➕ Atividade</button>')}

function actForm(a,day){const t=S.trip,ds=days(t),docs=t.docs.filter(x=>x.owner!='contas');
dlg(`<label>Título</label><input name=ti required value="${esc(a?.title)}"><label>Dia</label><select name=dy>${a&&!ds.includes(a.day)?`<option value=${a.day} selected>⚠ ${fd(a.day)}`:''}${ds.map(x=>`<option value=${x}${x==(a?.day||day)?' selected':''}>${dl(x)}`).join('')}</select><label>Início</label><input type=time name=s value="${a?.start||''}"><label>Fim</label><input type=time name=e value="${a?.end||''}"><label>Notas</label><textarea name=no rows=2>${esc(a?.notes)}</textarea><label>Documentos associados</label>${docs.map(x=>`<label class=ck><input type=checkbox name=dc value=${x.id}${a?.docs.includes(x.id)?' checked':''}>${esc(x.title)} <span class=mut>· ${esc(own(t,x.owner))}</span></label>`).join('')||'<span class=mut>Sem documentos.</span>'}`,
f=>{const s=f.get('s'),e=f.get('e');if(!s!=!e||(s&&tm(e)<=tm(s))){alert('Preenche o início e o fim (fim depois do início) ou deixa os dois vazios.');return false}
const o=a||{id:uid()};if(!a)t.rot.push(o);Object.assign(o,{title:f.get('ti').trim(),day:f.get('dy'),start:s,end:e,notes:f.get('no').trim(),docs:f.getAll('dc')});
const used=c=>t.rot.some(x=>x!=o&&x.day==o.day&&x.color==c);if(!o.color||used(o.color))o.color=PAL.find(c=>!used(c))||PAL[t.rot.length%PAL.length];
S.day=o.day;save(t);go()},a?'<button type=button class=btn id=rm>🗑</button>':'');
if(a)$('#rm').onclick=()=>{if(confirm('Remover esta atividade?')){t.rot=t.rot.filter(x=>x!=a);save(t);$('#d').close();go()}}}

function docForm(d,conta){const t=S.trip,P=t.people,cats=uniq(t.docs.map(x=>x.category)),curs=uniq(t.docs.filter(x=>x.owner=='contas').map(x=>x.cur));
dlg(`<label>Título</label><input name=ti required value="${esc(d?.title)}"><label>Categoria</label><input name=ca list=cl value="${esc(d?.category)}"><datalist id=cl>${cats.map(c=>`<option>${esc(c)}`).join('')}</datalist>`
+(conta?`<label>Valor</label><input name=am inputmode=decimal value="${d?.amount?(d.amount/100).toFixed(2).replace('.',','):''}"><label>Moeda</label><input name=cu list=cu value="${esc(d?.cur)}"><datalist id=cu>${curs.map(c=>`<option>${esc(c)}`).join('')}</datalist><label>Pago por</label><select name=pa><option value="">—${P.map(p=>`<option value=${p.id}${d?.paid==p.id?' selected':''}>${esc(p.name)}`).join('')}</select><label>Dividido por</label>${P.map(p=>`<label class=ck><input type=checkbox name=sp value=${p.id}${(d?d.split:P.map(x=>x.id)).includes(p.id)?' checked':''}>${esc(p.name)}</label>`).join('')}`:'')
+`<label>Notas</label><textarea name=no rows=3>${esc(d?.notes)}</textarea>`+(d?.files.length?`<label>Ficheiros (desmarca para remover)</label>${d.files.map(f=>`<label class=ck><input type=checkbox name=kp value=${f.id} checked>${esc(f.name)}</label>`).join('')}`:'')+`<label>Adicionar ficheiros (imagens ou PDF)</label><input type=file name=fl multiple accept="image/*,application/pdf">`,
async f=>{const o=d||{id:uid(),owner:conta?'contas':S.sub,created:new Date().toISOString(),files:[]};
o.title=f.get('ti').trim();o.category=f.get('ca').trim();o.notes=f.get('no').trim();
